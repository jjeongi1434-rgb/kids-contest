<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe8ff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꼬마 챔피언">
<title>꼬마 챔피언</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a sunny classroom wall — sky-to-peach backdrop with soft paper blobs, slips pinned in one column, tabs for 응모하기 / 신청함 / 1년 달력 / 지난 대회 */
:root {
  --sky: #cfe8ff;
  --sun: #fff1c9;
  --peach: #ffdfe6;
  --blob1: rgba(255, 255, 255, .55);
  --blob2: rgba(255, 214, 102, .35);
  --blob3: rgba(130, 196, 255, .35);
  --paper: #ffffff;
  --paper-soft: rgba(255, 255, 255, .72);
  --ink: #1f2b3d;
  --muted: #64738a;
  --line: #e2e8f0;
  --accent: #3a6fe0;
  --accent-ink: #ffffff;
  --hot: #e0453c; --hot-bg: #ffe6e3;
  --warm: #c27400; --warm-bg: #fff1d6;
  --calm: #2e8a55; --calm-bg: #e0f5e8;
  --none: #6b7a90; --none-bg: #eef2f7;
  --done: #7a4fd6; --done-bg: #efe8ff;
  --gold: #8a5a00; --gold-bg: #ffe9a8;
  --shadow: 0 1px 2px rgba(31, 60, 120, .06), 0 6px 18px rgba(31, 60, 120, .08);
  --font-display: "Jua", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --sky: #14223a; --sun: #1c2238; --peach: #2a1f33;
    --blob1: rgba(120, 160, 255, .10); --blob2: rgba(255, 200, 90, .08); --blob3: rgba(120, 200, 255, .10);
    --paper: #1e283a; --paper-soft: rgba(30, 40, 58, .75);
    --ink: #e8eef7; --muted: #9fb0c6; --line: #2f3c52;
    --accent: #7ea6ff; --accent-ink: #0f1a2c;
    --hot: #ff8a80; --hot-bg: #3b2124; --warm: #f5bb5c; --warm-bg: #3a2e18;
    --calm: #7fd6a2; --calm-bg: #1a3328; --none: #9fb0c6; --none-bg: #273347;
    --done: #b9a0ff; --done-bg: #2d2547;
    --gold: #ffd36b; --gold-bg: #3d3115;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; min-height: 100%; background: var(--sky); }
body {
  margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  background:
    radial-gradient(260px 260px at 88% 6%, var(--blob2), transparent 70%),
    radial-gradient(320px 320px at 4% 38%, var(--blob1), transparent 70%),
    radial-gradient(300px 300px at 96% 72%, var(--blob3), transparent 70%),
    linear-gradient(165deg, var(--sky) 0%, var(--sun) 52%, var(--peach) 100%);
  background-attachment: fixed;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(40px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; align-items: center; gap: 14px; }
header img { width: 52px; height: 52px; border-radius: 14px; box-shadow: var(--shadow); flex: none; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; line-height: 1.15; margin: 0; }
.sub { color: var(--muted); margin: 2px 0 0; font-size: 13.5px; }
header > div { flex: 1; min-width: 0; }
.install {
  flex: none; font: inherit; font-size: 14px; font-weight: 700; padding: 9px 14px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
}
.install-guide { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.install-guide p { margin: 0; font-size: 14px; color: var(--ink); line-height: 1.6; }
.install-guide button { align-self: flex-end; font: inherit; font-size: 13px; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }

.lock { background: var(--paper); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); max-width: 380px; }
.lock label { font-weight: 700; }
.lock-row { display: flex; gap: 8px; }
.lock input { flex: 1; min-width: 0; font: inherit; font-size: 22px; letter-spacing: .35em; padding: 8px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--none-bg); color: var(--ink); }
.lock button { font: inherit; font-weight: 700; padding: 8px 20px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.lock-msg { margin: 0; min-height: 1.5em; font-size: 14px; color: var(--hot); }

.content { display: flex; flex-direction: column; gap: 14px; }
.tabs {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
  background: var(--paper-soft); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  padding: 5px; border-radius: 16px; box-shadow: var(--shadow);
}
.tabs button {
  font: inherit; font-size: 14px; font-weight: 700; color: var(--muted); background: transparent;
  border: 0; border-radius: 12px; padding: 9px 4px; cursor: pointer; white-space: nowrap;
}
.tabs button[aria-selected="true"] { background: var(--paper); color: var(--accent); box-shadow: 0 1px 4px rgba(31, 60, 120, .12); }
.tabs .n { font-family: var(--font-body); font-size: 12px; font-weight: 500; margin-left: 3px; opacity: .8; font-variant-numeric: tabular-nums; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  font: inherit; font-size: 13px; padding: 5px 13px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--paper-soft); color: var(--ink);
}
.filters button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; margin: 0; }
.panel-head p { margin: 0; color: var(--muted); font-size: 12.5px; }

.list { display: flex; flex-direction: column; gap: 10px; list-style: none; margin: 0; padding: 0; }
.card { background: var(--paper); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.card.past { opacity: .72; }
a.main {
  display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 14px; align-items: center;
  padding: 14px 14px 10px; color: inherit; text-decoration: none;
}
a.main:hover .name { color: var(--accent); }
.chip { font-family: var(--font-display); font-size: 18px; text-align: center; border-radius: 12px; padding: 9px 0 7px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.chip small { display: block; font-family: var(--font-body); font-size: 10.5px; margin-top: 3px; }
.chip.hot { background: var(--hot-bg); color: var(--hot); }
.chip.warm { background: var(--warm-bg); color: var(--warm); }
.chip.calm { background: var(--calm-bg); color: var(--calm); }
.chip.none { background: var(--none-bg); color: var(--none); font-size: 15px; }
.chip.done { background: var(--done-bg); color: var(--done); font-size: 15px; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; transition: color .15s; }
.meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 0 7px; border-radius: 6px; background: var(--none-bg); color: var(--ink); margin-right: 6px; }
.when { font-size: 13.5px; font-weight: 500; font-variant-numeric: tabular-nums; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 14px 12px 90px; }
.bar .go { color: var(--accent); font-size: 13px; text-decoration: none; }
.bar button {
  font: inherit; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 5px 13px; cursor: pointer;
  border: 1px solid var(--done); background: transparent; color: var(--done);
}
.acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.bar button.hide { border-color: var(--line); color: var(--muted); font-weight: 500; }
.card.hidden-card { opacity: .6; }
.more { list-style: none; display: flex; justify-content: center; }
.more button { font: inherit; font-size: 13px; color: var(--muted); background: var(--paper-soft); border: 1px dashed var(--line); border-radius: 999px; padding: 6px 16px; cursor: pointer; }
.bar button.on { background: var(--done); color: var(--paper); }
.empty { background: var(--paper-soft); border-radius: 16px; padding: 22px 18px; color: var(--muted); text-align: center; font-size: 14px; }
.prize { align-self: flex-start; font-size: 12.5px; border-radius: 8px; padding: 2px 9px; margin-top: 2px; overflow-wrap: anywhere; }
.prize b { font-weight: 700; }
.odds { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.odds b { font-weight: 700; }
.odds.high b { color: var(--calm); }
.odds.mid b { color: var(--warm); }
.odds.low b { color: var(--none); }
.tag.t2 { background: var(--calm-bg); color: var(--calm); }
.prize.cash { background: var(--gold-bg); color: var(--gold); }
.prize.gift { background: var(--none-bg); color: var(--none); }
.soon { font-size: 11.5px; color: var(--accent); font-weight: 700; margin-left: 6px; white-space: nowrap; }
footer { color: var(--muted); font-size: 12.5px; text-align: center; padding-top: 6px; }

button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (max-width: 420px) {
  .tabs button { font-size: 13px; }
  .bar { padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) { .name { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <div>
      <h1>꼬마 챔피언</h1>
      <p class="sub">초등 2~4학년이 나갈 수 있는 외부 대회</p>
    </div>
    <button type="button" class="install" id="install" hidden>앱 설치</button>
  </header>

  <div class="install-guide" id="install-guide" hidden>
    <strong>휴대폰에 앱으로 설치하기</strong>
    <p id="guide-text"></p>
    <button type="button" id="guide-close">닫기</button>
  </div>

  <form class="lock" id="lock" autocomplete="off">
    <label for="pin">비밀번호를 넣어 주세요</label>
    <div class="lock-row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
      <button type="submit" id="unlock">열기</button>
    </div>
    <p class="lock-msg" id="lock-msg" role="status"></p>
  </form>

  <div class="content" id="content" hidden>
    <div class="tabs" role="tablist" id="tabs">
      <button type="button" role="tab" id="t-open" data-tab="open" aria-selected="true">응모하기<span class="n" id="n-open"></span></button>
      <button type="button" role="tab" id="t-mine" data-tab="mine" aria-selected="false">신청함<span class="n" id="n-mine"></span></button>
      <button type="button" role="tab" id="t-year" data-tab="year" aria-selected="false">1년 달력</button>
      <button type="button" role="tab" id="t-past" data-tab="past" aria-selected="false">지난 대회<span class="n" id="n-past"></span></button>
    </div>

    <div class="filters" role="group" aria-label="분야 고르기" id="filters">
      <button type="button" id="f-all" data-f="all" aria-pressed="true">전체</button>
      <button type="button" id="f-art" data-f="그림" aria-pressed="false">그림·포스터</button>
      <button type="button" id="f-write" data-f="글" aria-pressed="false">글짓기</button>
      <button type="button" id="f-sci" data-f="과학" aria-pressed="false">과학·수학</button>
      <button type="button" id="f-env" data-f="env" aria-pressed="false">환경</button>
      <button type="button" id="f-prize" data-f="prize" aria-pressed="false">상금 있는 대회</button>
      <button type="button" id="f-odds" data-f="odds" aria-pressed="false">상 받기 좋은 대회</button>
    </div>

    <section>
      <div class="panel-head"><h2 id="p-title"></h2><p id="p-hint"></p></div>
    </section>
    <ul class="list" id="list"></ul>

    <footer id="foot"></footer>
  </div>
</div>

<script>
var APPLIED_KEY = "kids-contest-applied", TAB_KEY = "kids-contest-tab", HIDDEN_KEY = "kids-contest-hidden";
function load(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

function start(data) {
  data = data || { open: [], yearly: [] };
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var thisMonth = today.getMonth() + 1;
  var days = ["일", "월", "화", "수", "목", "금", "토"];
  var filter = "all";
  var tab = load(TAB_KEY, "open");
  var applied = load(APPLIED_KEY, {});
  var hidden = load(HIDDEN_KEY, {});
  var showHidden = false;

  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function md(d) { return (d.getMonth() + 1) + "/" + d.getDate() + "(" + days[d.getDay()] + ")"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function id(c) { return c.name + "|" + (c.end || ""); }
  function yid(c) { return "y|" + c.name; }
  function isPast(c) { return !!c.end && parse(c.end) < today; }
  function byField(c) {
    if (filter === "prize") return !!(c.prize && c.prize.type === "상금");
    if (filter === "odds") return c.odds === "높음";
    if (filter === "env") return (c.tags || []).indexOf("환경") >= 0;
    if (filter === "과학") return c.field === "과학" || c.field === "수학" || (c.tags || []).some(function (t) { return t === "과학" || t === "수학" || t === "AI"; });
    return filter === "all" || c.field === filter;
  }
  function byEnd(a, b) { if (!a.end) return 1; if (!b.end) return -1; return parse(a.end) - parse(b.end); }

  function card(c, chipCls, chipHtml, whenHtml, opts) {
    opts = opts || {};
    var org = c.org ? " · " + esc(c.org) : "";
    var note = c.note ? "<span class=\"meta\">" + esc(c.note) + "</span>" : "";
    if (c.prize && c.prize.type) {
      note = "<span class=\"prize " + (c.prize.type === "상금" ? "cash" : "gift") + "\"><b>" + esc(c.prize.type) + "</b>" +
        (c.prize.text ? " " + esc(c.prize.text) : "") + "</span>" + note;
    }
    if (c.odds) {
      var oc = c.odds === "높음" ? "high" : c.odds === "낮음" ? "low" : "mid";
      note += "<span class=\"odds " + oc + "\"><b>수상 가능성 " + esc(c.odds) + "</b>" + (c.oddsReason ? " · " + esc(c.oddsReason) : "") + "</span>";
    }
    var tags = (c.tags || []).filter(function (t) { return t !== c.field; }).map(function (t) { return "<span class=\"tag t2\">" + esc(t) + "</span>"; }).join("");
    var fee = c.fee ? " · " + esc(c.fee) : "";
    var btn = "";
    if (opts.applyable) {
      var on = !!applied[id(c)];
      btn = "<button type=\"button\" data-id=\"" + esc(id(c)) + "\" class=\"" + (on ? "on" : "") + "\" aria-pressed=\"" + on + "\">" +
        (on ? "신청함에서 빼기" : "신청했어요") + "</button>";
    }
    if (opts.hideKey) {
      var off = !!hidden[opts.hideKey];
      btn = "<button type=\"button\" class=\"hide\" data-hide=\"" + esc(opts.hideKey) + "\">" + (off ? "다시 보이기" : "숨기기") + "</button>" + btn;
    }
    return "<li class=\"card" + (opts.past ? " past" : "") + (opts.hideKey && hidden[opts.hideKey] ? " hidden-card" : "") + "\">" +
      "<a class=\"main\" href=\"" + esc(c.url) + "\" target=\"_blank\" rel=\"noopener\">" +
      "<div class=\"chip " + chipCls + "\">" + chipHtml + "</div>" +
      "<div class=\"body\"><span class=\"name\">" + esc(c.name) + (opts.extra || "") + "</span>" +
      "<span class=\"when\">" + whenHtml + "</span>" +
      "<span class=\"meta\"><span class=\"tag\">" + esc(c.field) + "</span>" + tags + esc(c.target) + org + fee + "</span>" + note + "</div></a>" +
      "<div class=\"bar\"><a class=\"go\" href=\"" + esc(c.url) + "\" target=\"_blank\" rel=\"noopener\">사이트 열기 ↗</a><span class=\"acts\">" + btn + "</span></div></li>";
  }

  function deadlineChip(c) {
    if (!c.end) return ["none", "미정"];
    var left = Math.round((parse(c.end) - today) / 86400000);
    if (left < 0) return ["none", "마감"];
    if (left === 0) return ["hot", "오늘<small>마감</small>"];
    return [left <= 7 ? "hot" : left <= 30 ? "warm" : "calm", "D-" + left + "<small>남음</small>"];
  }
  function whenText(c) { return c.end ? "~ " + md(parse(c.end)) + " 마감" : esc(c.endText || "날짜 확인 필요"); }

  function openAll() { return data.open.filter(function (c) { return !isPast(c) && !applied[id(c)]; }); }
  function pastAll() { return data.open.filter(function (c) { return isPast(c) && !applied[id(c)]; }); }
  function shown(c) { return !hidden[id(c)]; }
  function isHid(c) { return !!hidden[id(c)]; }
  function openRows() { return openAll().filter(shown); }
  function mineRows() { return data.open.filter(function (c) { return applied[id(c)]; }); }
  function pastRows() { return pastAll().filter(shown); }

  function covers(c, m) { return c.from <= c.to ? (m >= c.from && m <= c.to) : (m >= c.from || m <= c.to); }

  var panels = {
    open: { title: "지금 응모할 수 있어요", hint: "마감이 가까운 순서",
      empty: "지금 응모할 수 있는 대회가 없어요. '1년 달력'에서 다음 대회를 확인해 보세요.",
      html: function () {
        return openRows().filter(byField).sort(byEnd).map(function (c) {
          var ch = deadlineChip(c); return card(c, ch[0], ch[1], whenText(c), { applyable: true, hideKey: id(c) });
        }).join("");
      },
      hiddenHtml: function () {
        return openAll().filter(isHid).filter(byField).sort(byEnd).map(function (c) {
          var ch = deadlineChip(c); return card(c, ch[0], ch[1], whenText(c), { hideKey: id(c) });
        });
      } },
    mine: { title: "신청한 대회", hint: "'신청했어요'를 누른 대회가 모여요",
      empty: "아직 신청한 대회가 없어요. 응모한 뒤 대회 카드의 '신청했어요'를 눌러 주세요.",
      html: function () {
        return mineRows().filter(byField).sort(byEnd).map(function (c) {
          var on = applied[id(c)];
          var label = isPast(c) ? "결과<small>기다리기</small>" : "신청<small>완료</small>";
          var when = (on && on !== true ? on.slice(5).replace("-", "/") + " 신청 · " : "") + whenText(c);
          return card(c, "done", label, when, { applyable: true });
        }).join("");
      } },
    year: { title: "해마다 열리는 대회", hint: "이번 달부터 차례대로 · 미리 준비하기",
      empty: "이 분야의 대회가 아직 없어요.",
      html: function () {
        return data.yearly.filter(function (c) { return !hidden[yid(c)]; }).filter(byField).map(function (c) {
          return { c: c, s: covers(c, thisMonth) ? 0 : (c.from - thisMonth + 12) % 12 };
        }).sort(function (a, b) { return a.s - b.s; }).map(function (r) {
          var c = r.c, cls = r.s === 0 ? "warm" : r.s === 1 ? "calm" : "none";
          var chip = r.s === 0 ? "지금<small>접수 시기</small>" : r.s === 1 ? "다음 달" : c.from + "월";
          var soon = r.s <= 1 ? "<span class=\"soon\">" + (r.s === 0 ? "이번 달" : "곧 시작") + "</span>" : "";
          return card(c, cls, chip, esc(c.when), { extra: soon, hideKey: yid(c) });
        }).join("");
      },
      hiddenHtml: function () {
        return data.yearly.filter(function (c) { return hidden[yid(c)]; }).filter(byField).map(function (c) {
          return card(c, "none", c.from + "월", esc(c.when), { hideKey: yid(c) });
        });
      } },
    past: { title: "지난 대회", hint: "마감이 지나 넘어간 대회",
      empty: "마감이 지난 대회가 없어요.",
      html: function () {
        return pastRows().filter(byField).sort(function (a, b) { return byEnd(b, a); }).map(function (c) {
          return card(c, "none", "마감", whenText(c), { past: true, applyable: true, hideKey: id(c) });
        }).join("");
      },
      hiddenHtml: function () {
        return pastAll().filter(isHid).filter(byField).map(function (c) {
          return card(c, "none", "마감", whenText(c), { past: true, hideKey: id(c) });
        });
      } }
  };

  function render() {
    if (!panels[tab]) tab = "open";
    var p = panels[tab];
    document.getElementById("p-title").textContent = p.title;
    document.getElementById("p-hint").textContent = p.hint;
    var html = p.html() || "<li class=\"empty\">" + p.empty + "</li>";
    var hid = p.hiddenHtml ? p.hiddenHtml() : [];
    if (hid.length) {
      html += "<li class=\"more\"><button type=\"button\" data-toggle=\"1\" aria-expanded=\"" + showHidden + "\">" +
        (showHidden ? "숨긴 대회 접기" : "숨긴 대회 " + hid.length + "개 보기") + "</button></li>";
      if (showHidden) html += hid.join("");
    }
    document.getElementById("list").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.setAttribute("aria-selected", b.getAttribute("data-tab") === tab ? "true" : "false");
    });
    document.getElementById("n-open").textContent = openRows().length;
    var m = mineRows().length; document.getElementById("n-mine").textContent = m ? m : "";
    var pa = pastRows().length; document.getElementById("n-past").textContent = pa ? pa : "";
  }

  document.getElementById("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    tab = b.getAttribute("data-tab"); save(TAB_KEY, tab); showHidden = false; render();
    window.scrollTo({ top: 0 });
  });
  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    filter = b.getAttribute("data-f");
    Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    render();
  });
  document.getElementById("list").addEventListener("click", function (e) {
    var t = e.target.closest("button[data-toggle]");
    if (t) { showHidden = !showHidden; render(); return; }
    var hb = e.target.closest("button[data-hide]");
    if (hb) {
      var hk = hb.getAttribute("data-hide");
      if (hidden[hk]) delete hidden[hk]; else hidden[hk] = 1;
      save(HIDDEN_KEY, hidden); render(); return;
    }
    var b = e.target.closest("button[data-id]"); if (!b) return;
    var k = b.getAttribute("data-id");
    if (applied[k]) delete applied[k];
    else { var t = new Date(); applied[k] = t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); }
    save(APPLIED_KEY, applied); render();
  });

  document.getElementById("foot").textContent =
    "마지막 정리 " + (data.updated || "-") + " · 매월 1일에 새로 찾아요 · 날짜는 신청 전에 대회 공고에서 꼭 확인하세요";
  render();
}

// 대회 목록은 비밀번호로 잠겨 있다 (PBKDF2 + AES-GCM). 맞는 비밀번호는 이 기기에만 기억한다.
var KEY = "kids-contest-pin";
var lockEl = document.getElementById("lock"), msgEl = document.getElementById("lock-msg"), pinEl = document.getElementById("pin");
var encPromise = fetch("data/contests.enc.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) {
  if (!r.ok) throw new Error("load"); return r.json();
});
function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
function decrypt(enc, pin) {
  var subtle = crypto.subtle;
  return subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]).then(function (base) {
    return subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }).then(function (key) {
    return subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  }).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
}
function tryOpen(pin, remember) {
  msgEl.textContent = "여는 중…";
  return encPromise.then(function (enc) { return decrypt(enc, pin); }).then(function (data) {
    if (remember) { try { localStorage.setItem(KEY, pin); } catch (e) {} }
    lockEl.hidden = true;
    document.getElementById("content").hidden = false;
    start(data);
  }, function (err) {
    if (err && err.message === "load") msgEl.textContent = "대회 목록을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.";
    else { msgEl.textContent = remember ? "비밀번호가 맞지 않아요." : ""; try { localStorage.removeItem(KEY); } catch (e) {} }
    pinEl.value = ""; pinEl.focus();
  });
}
lockEl.addEventListener("submit", function (e) { e.preventDefault(); if (pinEl.value) tryOpen(pinEl.value, true); });
var saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryOpen(saved, false); else pinEl.focus();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});

// 앱 설치: 안드로이드 크롬·삼성 인터넷은 설치 창을 바로 띄우고, 아이폰은 방법을 안내한다. 이미 앱으로 열었으면 버튼을 숨긴다.
(function () {
  var btn = document.getElementById("install"), guide = document.getElementById("install-guide"), text = document.getElementById("guide-text");
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  if (standalone) return;
  var ua = navigator.userAgent, isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isInApp = /KAKAOTALK|NAVER|Instagram|FBAN|FBAV|Line\//i.test(ua);
  var deferred = null;
  function showGuide(msg) { text.textContent = msg; guide.hidden = false; }
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener("appinstalled", function () { btn.hidden = true; guide.hidden = true; deferred = null; });
  btn.addEventListener("click", function () {
    if (deferred) {
      deferred.prompt();
      deferred.userChoice.then(function (r) { if (r.outcome === "accepted") btn.hidden = true; deferred = null; });
    } else if (isInApp) {
      showGuide("카카오톡·네이버 앱 안에서는 설치할 수 없어요. 오른쪽 위(또는 아래) 메뉴에서 '다른 브라우저로 열기'를 눌러 크롬이나 사파리로 연 뒤 다시 '앱 설치'를 눌러 주세요.");
    } else if (isIOS) {
      showGuide("사파리 아래쪽 가운데 공유 버튼(네모에서 화살표가 위로 나온 모양)을 누르고, 목록에서 '홈 화면에 추가'를 누른 뒤 오른쪽 위 '추가'를 누르세요.");
    } else {
      showGuide("브라우저 메뉴(⋮ 또는 ≡)에서 '앱 설치' 또는 '홈 화면에 추가'를 눌러 주세요. 크롬이나 삼성 인터넷에서 가장 잘 돼요.");
    }
  });
  document.getElementById("guide-close").addEventListener("click", function () { guide.hidden = true; });
  // 설치 창을 띄울 수 없는 브라우저(아이폰, 카카오톡 안 등)에서도 버튼은 보여 주고 안내를 띄운다
  if (isIOS || isInApp) btn.hidden = false;
  else setTimeout(function () { btn.hidden = false; }, 2500);
})();
</script>
